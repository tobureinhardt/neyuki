name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build & test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  # The threaded interpreter only compiles in optimized builds, so the debug
  # test job never runs it. Its handlers chain through tail calls that Rust
  # does not guarantee; if any dispatch path stops being a jump, the native
  # stack grows per instruction. The disassembly check finds such a path
  # directly; the long loops catch it on macOS. build.rs leaves the threaded
  # interpreter off on Windows, so that leg runs the release loop interpreter.
  release-threaded:
    name: Release threaded interpreter
    runs-on: ${{ matrix.os }}
    env:
      # Keep symbols so the tail-call check can find each handler.
      CARGO_PROFILE_RELEASE_STRIP: "false"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Clippy (threaded)
        run: cargo clippy --release --features threaded -- -D warnings
      - name: Build
        run: cargo build --release --features threaded
      - name: Check handler tail calls
        if: runner.os == 'Linux'
        run: python3 .github/scripts/check_tail_calls.py target/release/neyuki src/vm/threaded.rs
      - name: Run tests
        run: cargo test --release --features threaded
      - name: Long loops
        shell: bash
        run: |
          cat > long_loops.nyk <<'NYK'
          for i = 1, 1e8 do end
          local n = 0
          for i = 1, 20000000 do n = n + i % 7 end
          local function f(x) return x + 1 end
          local c = 0
          for i = 1, 5000000 do c = f(c) end
          local t = {}
          for i = 1, 5000000 do t[i % 64 + 1] = i end
          local u = 0
          local function bump() u = u + 1 end
          for i = 1, 5000000 do bump() end
          for i = 1.0, 3e7 do end
          local x = 0
          for i = 1, 3000000 do x = x + 0.5 end
          local m = setmetatable({}, {
            __len = function() return 1 end,
            __unm = function() return 2 end,
          })
          local s = 0
          for i = 1, 2000000 do s = s + #m + -m end
          local k = 0
          for i = 1, 3000000 do k = (i // 4) + (i % 8) end
          print(n, c, u, x, s, k)
          NYK
          ./target/release/neyuki long_loops.nyk

  fuzz:
    name: Fuzz (time-boxed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # A debug build keeps overflow checks and debug assertions on, so
      # arithmetic bugs surface as panics.
      - name: Build
        run: cargo build
      # About 4.5 minutes in all. The bytecode loader and verifier go first
      # and get the most time: they read untrusted .nykb files. Any panic,
      # even one the VM would catch, or a case hanging for 20s fails the job.
      # The seed is printed; a crashing input is saved to fuzz-artifacts/.
      # Address space is capped so a runaway allocation aborts the run, with
      # the input that caused it left in fuzz-artifacts/<target>-current.*.
      - name: Fuzz
        run: |
          ulimit -v 6000000
          seed=$(( GITHUB_RUN_ID % 1000000007 ))
          ./target/debug/neyuki fuzz file --seconds 90 --seed "$seed" --keep-going
          ./target/debug/neyuki fuzz tree --seconds 60 --seed "$seed" --keep-going
          ./target/debug/neyuki fuzz vm --seconds 60 --seed "$seed" --keep-going
          ./target/debug/neyuki fuzz libs --seconds 45 --seed "$seed" --keep-going
          ./target/debug/neyuki fuzz memory --seconds 30 --seed "$seed" --keep-going
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check advisories, licenses, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  lint-libs:
    name: Lint bundled libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      # Warnings fail the job too, not only errors.
      - name: Lint lib/*.nyk
        run: |
          status=0
          for file in lib/*.nyk; do
            if [ "$(./target/debug/neyuki lint --json "$file")" != "[]" ]; then
              ./target/debug/neyuki lint "$file" || true
              echo "::error file=$file::neyuki lint reported issues"
              status=1
            else
              echo "$file: clean"
            fi
          done
          exit $status
