name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than latest: the binary links the runner's glibc and
          # libssl, so an older base runs on more distros.
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          # macos-latest is Apple Silicon; the Apple SDK there also targets x86_64.
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-latest,     target: x86_64-apple-darwin }
          # MSVC ships an ARM64 cross toolchain, so both build on the x64 runner.
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { os: windows-latest,   target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install webview system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      # Staged before the next build runs: both land on the same path under
      # target/, so the default executable has to be copied out first.
      - name: Stage the default build
        shell: bash
        run: |
          name=neyuki-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp LICENSE README.md "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/neyuki.exe "$name/"
          else
            cp target/${{ matrix.target }}/release/neyuki "$name/"
          fi
      # `@neyuki/gpu` stays out of `default` because it costs several MiB, so
      # each archive carries a second executable with it compiled in rather
      # than there being a second archive to pick between: one download, and
      # `neyuki-gpu` for the scripts that want it. The first build has already
      # compiled everything the two share, so this adds wgpu's tree and a link.
      - name: Build with the gpu feature
        run: cargo build --release --features gpu --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=neyuki-${GITHUB_REF_NAME}-${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/neyuki.exe "$name/neyuki-gpu.exe"
            7z a "$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/neyuki "$name/neyuki-gpu"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: neyuki-${{ matrix.target }}
          path: |
            neyuki-*.tar.gz
            neyuki-*.zip

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Publish the draft by hand after review. Don't pre-create the release
      # in the UI: the action appends generated notes to an existing release,
      # duplicating them.
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
