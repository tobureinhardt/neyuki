[package]
name = "neyuki"
version = "0.7.0"
edition = "2024"
description = "A small Lua-like scripting language implemented in Rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/neyuki-lang/neyuki"
homepage = "https://neyuki.cc/"

[lib]
name = "neyuki"
path = "src/lib.rs"

[[bin]]
name = "neyuki"
path = "src/main.rs"

[features]
default = ["webview"]
# `@neyuki/webview`: pages rendered by the system web engine through `wry`.
# On Linux this links WebKitGTK and GTK 3 (libwebkit2gtk-4.1-dev, libgtk-3-dev);
# build with `--no-default-features` where those are not installed.
webview = ["dep:wry", "dep:gtk"]
# `@neyuki/gpu`: a GPU surface on a `ui` window through `wgpu` (Direct3D 12,
# Vulkan, Metal). Off by default while the module is a spike: it adds a large
# dependency tree and several MiB to the executable, and `@neyuki/ui` keeps
# rendering on the CPU either way.
gpu = ["dep:wgpu", "dep:pollster"]
mimalloc = ["dep:mimalloc"]

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rand = "0.8"
# A maintained fork of `tiny_http` 0.12, kept under the original name. Upstream
# drains an unread request body by allocating a buffer of the remaining
# declared Content-Length, so a client claiming a huge body and hanging up
# aborts the process; the fork reads it through a fixed-size buffer.
tiny_http = { package = "tiny_http_dh", version = "0.12.2" }
# TLS goes through the platform library (`native-tls`: SChannel, Secure
# Transport, OpenSSL on Linux) so certificates come from the OS trust store.
# schannel 0.1.28+ links Windows APIs with `raw-dylib`, which needs `dlltool`
# on the windows-gnu toolchain; older versions use prebuilt import libraries.
# `gzip` and `brotli` let it advertise and transparently decode compressed
# responses (brotli through the pure-Rust `brotli-decompressor`).
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "brotli", "charset"] }
# Not used directly: naming `flate2` with `zlib-rs` switches the deflate
# backend that `ureq` (gzip responses) and `mysql` (compressed protocol) share
# from `miniz_oxide` to `zlib-rs`, which decompresses noticeably faster and
# needs no C compiler or CMake (unlike `zlib-ng`).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# `@neyuki/crypto` is built on the RustCrypto / dalek crates, which cover
# every algorithm it exposes (including RSA key generation, bcrypt and
# argon2, which `ring` lacks). These are all from the digest-0.10 /
# rand_core-0.6 generation, which matches `rand` above.
md-5 = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
hkdf = "0.12"
argon2 = "0.5"
bcrypt = "0.16"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
base64 = "0.22"
subtle = "2"

# `@neyuki/sql` speaks to PostgreSQL and MySQL/MariaDB through these native
# Rust drivers (no libpq or libmysqlclient), with TLS through the platform
# `native-tls` like `ureq` above. The `mysql` defaults are dropped: their
# `minimal` feature forces the stock C zlib onto every `flate2` user (it wins
# over `zlib-rs`, chosen above) and `derive` is unused. `minimal-rust` leaves
# the backend to `flate2`. `postgres-protocol` decodes the wire values that the
# `postgres` crate leaves to companion crates (dates, uuids, arrays).
postgres = "0.19"
postgres-native-tls = "0.5"
postgres-protocol = "0.6"
native-tls = "0.2"
fallible-iterator = "0.2"
mysql = { version = "28", default-features = false, features = ["minimal-rust", "native-tls", "buffer-pool"] }

# `@neyuki/ui` opens windows through `winit`, blits CPU-rendered frames with
# `softbuffer` and draws them with `tiny-skia` and `fontdue`. `image` decodes
# PNG, JPEG, WebP, GIF and BMP (animations included) through its pure-Rust
# codecs (`png`, `zune-jpeg`, `image-webp`, `gif`); only those formats are
# enabled. All pure Rust, so no GPU, GL or C compiler is needed. On Linux the
# X11, Wayland and xkbcommon client libraries are loaded at runtime (dlopen)
# rather than linked, so a build machine needs none of them and a headless
# machine still runs everything else.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = "0.4"
tiny-skia = "0.11"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# The now-playing session and media keys of `@neyuki/ui`: Windows'
# SystemMediaTransportControls, MPRIS on Linux and MPNowPlayingInfoCenter on
# macOS behind one API. Its zbus backend speaks D-Bus in pure Rust, where
# the default one links the C libdbus.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
# `ui.openUrl` hands links to the default browser or mail client through
# `open` (ShellExecuteW on Windows, `open` on macOS, xdg-open and friends on
# Linux) instead of spawning shell commands by hand.
open = "5"

# `@neyuki/hid` drives the keyboard and mouse through `enigo` (SendInput on
# Windows, CoreGraphics on macOS, XTest over the pure-Rust `x11rb` on X11)
# and the clipboard through `arboard`.
enigo = "0.6"
arboard = { version = "3", default-features = false }

# `@neyuki/gpu` talks to the platform graphics API through `wgpu`: Direct3D 12
# on Windows, Metal on macOS, Vulkan (with an OpenGL ES fallback) elsewhere.
# `webgpu` is dropped from the defaults, as it only targets the browser and
# pulls in `wasm-bindgen` and `web-sys`; `wgsl` keeps the shader front end
# that every backend needs. Behind the `gpu` feature, so a default build links
# none of it.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "gles", "wgsl"], optional = true }
# wgpu's adapter and device requests are futures. They resolve on the calling
# thread on every native backend, but the API is a future either way, so
# `pollster` (no dependencies of its own) parks the thread properly instead
# of spinning on it.
pollster = { version = "0.4", optional = true }

# `@neyuki/webview` hosts WebView2 (Windows), WKWebView (macOS) and WebKitGTK
# (Linux) through `wry`, inside the same `winit` event loop as `@neyuki/ui`.
wry = { version = "0.52", optional = true }

# `os.date` formats times and reads the local time zone through the
# operating system (Windows API bindings, /etc/localtime, CoreFoundation).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fontdb = "0.23"

# `neyuki build` sets the icon, version resource and subsystem of the Windows
# executable it writes. `editpe` edits PE files on any host, so a Linux or
# macOS machine can build a Windows app from a Windows runtime. `images` is
# off: it pulls in the `image` crate only to resize icons, and `.png` icons
# are wrapped into `.ico` files by `neyuki build` itself.
editpe = { version = "0.2", default-features = false, features = ["std"] }

# Opt-in global allocator for the `neyuki` binary (`--features mimalloc`).
# The VM allocates many small, short-lived tables, strings and closures, the
# workload mimalloc is built for; it needs a C compiler. Off by default until
# `neyuki bench` numbers on each release platform justify turning it on.
mimalloc = { version = "0.1", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
schannel = ">=0.1.23, <0.1.28"
# `os.protect` seals secrets with DPAPI (CryptProtectData) for the current
# user. 0.59 is the generation that still links through import libraries,
# for the same windows-gnu reason as `schannel` above. A built app also
# shows an error that ends it in a message box, as it has no console.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

# Elsewhere `os.protect` keeps a random AES-256-GCM key in the OS keychain:
# Keychain Services on macOS, the Secret Service over the pure-Rust `zbus`
# D-Bus client on Linux and the BSDs (no libdbus needed to build or run).
[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.6", features = ["apple-native", "async-secret-service", "async-io", "crypto-rust"] }

# On Wayland, XTest only reaches XWayland windows, so `@neyuki/hid` drives the
# compositor's virtual keyboard and pointer itself. enigo's own Wayland
# backend would link libxkbcommon; these are protocol bindings only, and
# `tempfile` holds the keymap the virtual keyboard is given.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# `gtk` hosts the web view on Linux, where WebKitGTK cannot live in a winit window.
gtk = { version = "0.18", optional = true }
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
tempfile = "3"

# Debug builds still optimize dependencies: the crypto crates run 10-50x
# slower unoptimized, enough that `hashPassword` and `pbkdf2` at their default
# costs take seconds under `cargo run` and `cargo test`.
[profile.dev.package."*"]
opt-level = 3

# Optimized for speed and small binary size. `panic = "abort"` is intentionally
# omitted: the parser, the VM and the REPL keep `catch_unwind` as a last-resort
# guard against interpreter bugs, and `@neyuki/ui` catches the panic `winit`
# raises on macOS when an event loop is built off the main thread.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
