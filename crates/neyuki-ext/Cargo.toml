[package]
name = "neyuki-ext"
version = "0.1.0"
edition = "2024"
description = "Write Neyuki native extensions and native packages in safe Rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/neyuki-lang/neyuki"
homepage = "https://neyuki.cc/"
